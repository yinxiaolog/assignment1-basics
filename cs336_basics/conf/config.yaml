model:
    epochs: 2
    batch_size: 32
    vocab_size: 32000
    context_length: 256
    device: "cuda"
    backend: "inductor"
    world_size: 1
    total_tokens_processed: 3276800000

optimizer:
    name: "AdamW"
    lr: 1e-3

loss_fn:
    name: "CrossEntropyLoss"

data:
    train_dataset_path: "/opt/datasets/cs336/owt_train.npy"
    val_dataset_path: "/opt/datasets/cs336/owt_valid.npy"
    tokenizer_path: "/opt/datasets/cs336/owt_train_tokenzier.pkl"

log:
    step: 100
    dir: "/opt/log"

swanlab:
    exp_name: default
